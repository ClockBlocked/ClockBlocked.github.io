<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c2128">
  <meta name="description" content="Library Stream — stream and share your personal video library.">
  <title>Library Stream</title>

  <link rel="preconnect" href="https://image.mux.com" crossorigin>
  <link rel="preconnect" href="https://stream.mux.com" crossorigin>
  <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.4.0/css/all.css">
  <link rel="stylesheet" href="./ui.css">

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js" defer></script>
  <script src="./script.js" defer></script>
</head>
<body>

  <!-- Route progress bar -->
  <div id="route-loader" aria-hidden="true"><span></span></div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="#/" class="brand" aria-label="Library Stream home"><i class="fa-solid fa-play"></i></a>
    <nav class="nav" aria-label="Primary">
      <a href="#/" class="nav-item" data-nav="/" aria-label="Library"><i class="fa-solid fa-house"></i></a>
      <a href="#/explore" class="nav-item" data-nav="/explore" aria-label="Explore"><i class="fa-solid fa-compass"></i></a>
    </nav>
    <div class="nav-bottom">
      <a href="#/queue" class="nav-item" data-nav="/queue" aria-label="Queue">
        <i class="fa-solid fa-list-ul"></i>
        <span class="nav-badge" id="queue-badge" hidden>0</span>
      </a>
    </div>
  </aside>

  <!-- Scrollable app surface -->
  <main id="app" tabindex="-1">
    <div class="view" id="view"></div>
  </main>

  <!-- Toasts -->
  <div id="toasts" class="toast-container" role="status" aria-live="polite"></div>

  <!-- Player -->
  <div id="player" class="player" aria-hidden="true" role="dialog" aria-label="Video player">
    <div class="player-top" id="player-top">
      <span class="player-pill" aria-hidden="true"></span>
      <div class="player-info">
        <h2 id="player-title">—</h2>
        <p id="player-sub">—</p>
      </div>
      <div class="player-btns">
        <button class="pbtn" id="btn-pip" title="Picture in picture" aria-label="Picture in picture">
          <i class="fa-solid fa-clone"></i>
        </button>
        <button class="pbtn" id="btn-mini" title="Mini player" aria-label="Mini player">
          <i class="fa-solid fa-compress"></i>
        </button>
        <button class="pbtn danger" id="btn-close" title="Close" aria-label="Close player">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>
    <div class="player-stage">
      <video id="video" playsinline crossorigin="anonymous" controls preload="metadata"></video>
      <div class="player-spinner" id="player-spinner"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
    </div>
  </div>

  <noscript><div class="noscript">Library Stream requires JavaScript.</div></noscript>
</body>
</html>
