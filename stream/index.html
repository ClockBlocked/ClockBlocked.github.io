<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e14">
  <meta name="description" content="Library Stream — stream and share your personal video library.">
  <title>Library Stream</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://image.mux.com" crossorigin>
  <link rel="preconnect" href="https://stream.mux.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ink: {
              950: '#070a10',
              900: '#0a0e14',
              800: '#11161f',
              700: '#171d28',
              600: '#1e2531',
              500: '#28303d',
              400: '#343d4c',
              300: '#4a5464',
            },
            accent: {
              DEFAULT: '#539bf5',
              soft:    '#7fb4ff',
              glow:    'rgba(83,155,245,0.35)',
            },
            violet: '#a855f7',
            pink:   '#ec4899',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
          boxShadow: {
            glow: '0 0 40px -12px rgba(83,155,245,0.55)',
          },
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.4.0/css/all.css">
  <link rel="stylesheet" href="./ui.css">

  <script src="https://cdn.jsdelivr.net/npm/preline@2.4.1/dist/preline.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js" defer></script>
  <script src="./script.js" defer></script>
</head>

<body class="bg-ink-900 text-slate-400 font-sans antialiased h-screen overflow-hidden">

  <!-- Ambient background glows -->
  <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden" aria-hidden="true">
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>
    <div class="ambient ambient-c"></div>
  </div>

  <!-- Route loader -->
  <div id="route-loader" aria-hidden="true"><span></span></div>

  <!-- Sidebar -->
  <aside class="fixed left-0 top-0 h-screen w-[76px] bg-ink-800/70 backdrop-blur-2xl border-r border-white/[0.04] flex flex-col items-center py-5 z-40">

    <a href="#/" class="brand" aria-label="Library Stream home">
      <i class="fa-solid fa-play"></i>
    </a>

    <nav class="flex flex-col gap-1.5 mt-2" aria-label="Primary">
      <a href="#/" class="nav-btn" data-nav="/" aria-label="Library">
        <i class="fa-solid fa-house"></i>
        <span class="nav-indicator"></span>
      </a>
      <a href="#/explore" class="nav-btn" data-nav="/explore" aria-label="Explore">
        <i class="fa-solid fa-compass"></i>
        <span class="nav-indicator"></span>
      </a>
    </nav>

    <div class="mt-auto">
      <a href="#/queue" class="nav-btn" data-nav="/queue" aria-label="Queue">
        <i class="fa-solid fa-list-ul"></i>
        <span class="nav-indicator"></span>
        <span id="queue-badge" class="queue-badge" hidden>0</span>
      </a>
    </div>
  </aside>

  <!-- App surface -->
  <main id="app" class="ml-[76px] h-screen overflow-y-auto">
    <div id="view" class="mx-auto max-w-[1800px] px-6 md:px-10 py-8 md:py-12 pb-32"></div>
  </main>

  <!-- Toasts -->
  <div id="toasts" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[9999] flex flex-col items-center gap-2 pointer-events-none" aria-live="polite"></div>

  <!-- Player -->
  <div id="player" class="player" aria-hidden="true" role="dialog" aria-label="Video player">
    <div id="player-top" class="player-top">
      <span class="player-pill" aria-hidden="true"></span>
      <div class="flex-1 min-w-0">
        <h2 id="player-title" class="text-[14.5px] font-semibold text-white truncate leading-tight">—</h2>
        <p id="player-sub" class="text-[11.5px] text-slate-500 mt-0.5 truncate">—</p>
      </div>
      <div class="flex gap-1.5 shrink-0">
        <button class="pbtn" id="btn-pip" aria-label="Picture in picture" title="Picture in picture">
          <i class="fa-solid fa-clone"></i>
        </button>
        <button class="pbtn" id="btn-mini" aria-label="Mini player" title="Mini player">
          <i class="fa-solid fa-compress"></i>
        </button>
        <button class="pbtn danger" id="btn-close" aria-label="Close player" title="Close">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>
    <div class="player-stage">
      <video id="video" playsinline crossorigin="anonymous" controls preload="metadata"></video>
      <div class="player-spinner" id="player-spinner">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
      </div>
    </div>
  </div>

  <noscript>
    <div class="fixed inset-0 grid place-items-center bg-ink-900 text-slate-200 z-[99999]">
      Library Stream requires JavaScript.
    </div>
  </noscript>



  
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>

<script>
    eruda.init();
    console.log("Eruda console is ready!");
</script>



</body>
</html>
