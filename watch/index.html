<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Gallery</title>
  <link rel="stylesheet" href="./ui.css">
  <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.4.0/css/all.css">
</head>
<body>
  <header class="app-header">
    <div class="header-logo">
      <i class="fa-solid fa-play-circle"></i>
      <h1>VidGallery</h1>
    </div>
    <nav class="header-nav">
      <button class="nav-btn"><i class="fa-regular fa-compass"></i> Discover</button>
      <button class="nav-btn"><i class="fa-regular fa-heart"></i> Favorites</button>
      <button class="nav-btn"><i class="fa-regular fa-bookmark"></i> Bookmarks</button>
    </nav>
    <div class="header-search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="Search videos...">
    </div>
  </header>

  <main class="gallery-container">
    <div class="masonry-grid" id="masonry-grid"></div>
  </main>

  <div id="transition-overlay"></div>

  <div id="video-player-container" class="hidden">
    <div class="player-header">
      <button class="player-btn" id="btn-minimize"><i class="fa-solid fa-compress"></i></button>
      <button class="player-btn" id="btn-close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    
    <div class="player-media-wrapper">
      <video id="main-video" controlslist="nodownload"></video>
      
      <div class="player-controls">
        <div class="progress-container" id="progress-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="controls-row">
          <div class="controls-left">
            <button class="player-btn" id="btn-play-pause"><i class="fa-solid fa-play"></i></button>
            <div class="volume-container">
              <button class="player-btn" id="btn-mute"><i class="fa-solid fa-volume-high"></i></button>
              <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
            </div>
            <span class="time-display" id="time-display">00:00 / 00:00</span>
          </div>
          <div class="controls-right">
            <button class="player-btn" id="btn-fullscreen"><i class="fa-solid fa-expand"></i></button>
          </div>
        </div>
      </div>
    </div>

    <div class="player-metadata">
      <h2 id="meta-title"></h2>
      <div class="meta-badges">
        <span class="badge" id="meta-category"></span>
      </div>
      <p id="meta-description"></p>
      <div class="meta-actions">
        <button class="action-btn"><i class="fa-regular fa-heart"></i> Like</button>
        <button class="action-btn"><i class="fa-regular fa-bookmark"></i> Save</button>
        <button class="action-btn"><i class="fa-solid fa-share-nodes"></i> Share</button>
      </div>
    </div>
  </div>

  <script src="./site.js"></script>
</body>
</html>
