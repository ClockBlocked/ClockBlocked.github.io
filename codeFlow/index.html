<!DOCTYPE html>
<html lang="en" data-theme="dark-dimmed">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Gists Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.0.1/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.0.1/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.0.1/codemirror.min.css">
    <link rel="stylesheet" href="./src/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="./modules/manifest.json">
</head>
<body>
    <!-- Loading Spinner -->
    <div id="loading-spinner" class="loading-spinner">
        <div class="spinner-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <!-- Progress Bar -->
    <div id="progress-bar" class="progress-bar"></div>

    <!-- Mobile Navigation -->
    <div id="mobile-nav" class="mobile-nav">
        <button class="mobile-nav-toggle" id="mobile-nav-toggle">
            <i class="fas fa-bars"></i>
        </button>
        <div class="mobile-nav-content" id="mobile-nav-content">
            <a href="#/" class="nav-link" data-page="home">
                <i class="fas fa-code"></i> Snippets
            </a>
            <a href="#/new" class="nav-link" data-page="new">
                <i class="fas fa-plus"></i> New
            </a>
            <a href="#/profile" class="nav-link" data-page="profile">
                <i class="fas fa-user"></i> Profile
            </a>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app" class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo">
                    <i class="fab fa-github"></i>
                    <span>Gists</span>
                </div>
                <nav class="desktop-nav">
                    <a href="#/" class="nav-link active" data-page="home">Snippets</a>
                    <a href="#/new" class="nav-link" data-page="new">New Snippet</a>
                    <a href="#/profile" class="nav-link" data-page="profile">Profile</a>
                </nav>
            </div>
            <div class="header-right">
                <div class="search-container">
                    <input type="text" id="search-input" class="search-input" placeholder="Search snippets...">
                    <i class="fas fa-search search-icon"></i>
                </div>
                <button id="theme-toggle" class="btn-icon">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="user-avatar">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=user" alt="User Avatar">
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content">
            <!-- Content will be dynamically loaded here -->
        </main>

        <!-- Toast Notifications Container -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Mobile Bottom Navigation -->
        <nav class="mobile-bottom-nav">
            <a href="#/" class="bottom-nav-link active" data-page="home">
                <i class="fas fa-code"></i>
                <span>Snippets</span>
            </a>
            <a href="#/new" class="bottom-nav-link" data-page="new">
                <i class="fas fa-plus"></i>
                <span>New</span>
            </a>
            <a href="#/profile" class="bottom-nav-link" data-page="profile">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.0.1/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.0.1/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.0.1/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.0.1/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.0.1/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.0.1/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.0.1/mode/php/php.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.0.1/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.0.1/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.0.1/addon/display/autorefresh.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.0.1/addon/search/search.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.0.1/addon/search/searchcursor.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>
    <script src="./modules/storage.js"></script>
    <script src="./modules/components.js"></script>
    <script src="./modules/editor.js"></script>
    <script src="./modules/router.js"></script>
    <script src="./modules/app.js"></script>
    
    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./modules/serviceWorker.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed:', err));
        }
    </script>
</body>
</html>
