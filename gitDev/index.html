<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GitDev - Local File Manager with GitHub-inspired Interface">
    <meta name="theme-color" content="#1c2128">
    <title>GitDev - File Explorer</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/material-darker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prismjs/1.29.0/themes/prism-dark.min.css">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.0/tailwind.min.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
        }
        
        .github-dark {
            --color-canvas-default: #0d1117;
            --color-canvas-inset: #010409;
            --color-canvas-overlay: #161b22;
            --color-canvas-subtle: #21262d;
            --color-border-default: #30363d;
            --color-border-muted: #21262d;
            --color-bg-primary: #0d1117;
            --color-bg-secondary: #161b22;
            --color-fg-default: #c9d1d9;
            --color-fg-muted: #8b949e;
            --color-fg-subtle: #6e7681;
            --color-accent-fg: #58a6ff;
            --color-success-fg: #3fb950;
            --color-danger-fg: #f85149;
            --color-warning-fg: #d29922;
        }
        
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-color: var(--color-canvas-default);
        }
        
        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 0;
        }
        
        .main-content {
            display: flex;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        
        .hidden {
            display: none !important;
        }
        
        .visible {
            display: flex !important;
        }
        
        .sidebar {
            width: 260px;
            background-color: var(--color-canvas-inset);
            border-right: 1px solid var(--color-border-default);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        .sidebar-section {
            padding: 12px 0;
            border-bottom: 1px solid var(--color-border-muted);
        }
        
        .sidebar-title {
            padding: 0 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--color-fg-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .sidebar-item {
            padding: 8px 16px;
            cursor: pointer;
            transition: background-color 0.15s ease;
            color: var(--color-fg-default);
            border-left: 3px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .sidebar-item:hover {
            background-color: var(--color-canvas-overlay);
        }
        
        .sidebar-item.active {
            background-color: var(--color-canvas-overlay);
            border-left-color: var(--color-accent-fg);
            color: var(--color-accent-fg);
        }
        
        .sidebar-item-icon {
            margin-right: 8px;
            display: inline-block;
            vertical-align: middle;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                display: none;
                position: absolute;
                left: 0;
                top: 0;
                width: 260px;
                height: 100%;
                z-index: 100;
            }
            
            .sidebar.visible {
                display: flex;
            }
        }
        
        .gh-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2.5px;
            z-index: 9999;
            background-color: transparent;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .gh-progress.visible {
            opacity: 1;
        }
        
        .gh-progress-fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #58a6ff 0%, #3fb950 50%, #f85149 100%);
            transition: width 0.3s ease-out;
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.5);
        }
    </style>
</head>
<body class="github-dark">
    <div class="app-container">
        <div id="sidebar-left" class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Repositories</div>
                <div id="repoList"></div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-title">Recent Files</div>
                <div id="recentFilesList"></div>
            </div>
        </div>
        
        <div class="main-content">
            <div id="repoSelectorView" class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8 py-6 hidden w-full h-full flex flex-col">
                <div class="flex-1 flex flex-col items-center justify-center">
                    <svg class="w-16 h-16 text-gray-500 mb-4" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3 3a2 2 0 0 1 2-2h3.28a1 1 0 0 1 .948.684l1.498 4.493a1 1 0 0 1-.502 1.21l-2.257 1.13a11.042 11.042 0 0 0 5.516 5.516l1.13-2.257a1 1 0 0 1 1.21-.502l4.493 1.498a1 1 0 0 1 .684.949V19a2 2 0 0 1-2 2h-1C9.716 21 3 14.284 3 6V5a2 2 0 0 1 2-2Z"/>
                    </svg>
                    <h1 class="text-3xl font-bold text-gray-300 mb-2">Welcome to GitDev</h1>
                    <p class="text-gray-400 mb-8">Create or select a repository to get started</p>
                    <button onclick="modals.show('create')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md font-medium transition-colors">
                        Create New Repository
                    </button>
                </div>
            </div>
            
            <div id="explorerView" class="hidden w-full h-full flex flex-col">
                <div class="bg-gray-800 border-b border-gray-700 p-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2" id="pathBreadcrumb"></div>
                        <button onclick="modals.show('createFile')" class="px-3 py-1.5 bg-green-600 hover:bg-green-700 text-white rounded-md text-sm font-medium transition-colors">
                            New File
                        </button>
                    </div>
                </div>
                
                <div class="flex-1 overflow-y-auto">
                    <table class="w-full">
                        <thead class="bg-gray-750 sticky top-0">
                            <tr class="border-b border-gray-700">
                                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-400 uppercase tracking-wider">Name</th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-400 uppercase tracking-wider">Last Commit</th>
                                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-400 uppercase tracking-wider">Modified</th>
                                <th class="px-6 py-3 text-right text-xs font-semibold text-gray-400 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="fileListBody"></tbody>
                    </table>
                </div>
            </div>
            
            <div id="fileViewer" class="hidden w-full h-full flex flex-col overflow-hidden">
                <div id="codeViewerContainer" class="flex-1 overflow-hidden"></div>
            </div>
        </div>
    </div>
    
    <div id="loadingOverlay" class="fixed inset-0 bg-gray-900/90 backdrop-blur-sm z-50 items-center justify-center hidden flex-col gap-4">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-blue-500 border-opacity-75"></div>
        <p id="loadingText" class="text-gray-300 text-sm">Loading...</p>
    </div>
    
    <div id="createRepoModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-gray-800 rounded-lg shadow-xl w-full max-w-md border border-gray-700">
            <div class="p-6">
                <h2 class="text-xl font-semibold text-gray-100 mb-4">Create New Repository</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Repository Name</label>
                        <input type="text" id="newRepoName" placeholder="my-repository" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Description</label>
                        <textarea id="repoDescriptionInput" rows="3" placeholder="A brief description..." class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
                    </div>
                    
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-300">Visibility</label>
                        <div class="flex gap-4">
                            <label class="flex items-center">
                                <input type="radio" name="visibility" id="visibilityPublic" value="public" checked class="mr-2">
                                <span class="text-gray-300">Public</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="visibility" id="visibilityPrivate" value="private" class="mr-2">
                                <span class="text-gray-300">Private</span>
                            </label>
                        </div>
                    </div>
                    
                    <label class="flex items-center">
                        <input type="checkbox" id="initReadme" checked class="mr-2">
                        <span class="text-gray-300">Initialize with README</span>
                    </label>
                </div>
                
                <div class="flex gap-3 mt-6">
                    <button onclick="modals.show('create')" class="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md font-medium transition-colors">
                        Create Repository
                    </button>
                    <button onclick="modals.hide('create')" class="flex-1 px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-100 rounded-md font-medium transition-colors">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="createFileModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-gray-800 rounded-lg shadow-xl w-full max-w-2xl border border-gray-700 max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <h2 class="text-xl font-semibold text-gray-100 mb-4">Create New File</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">File Name</label>
                        <div class="flex">
                            <span class="px-3 py-2 bg-gray-700 border border-r-0 border-gray-600 rounded-l-md text-gray-400" id="currentPathPrefix"></span>
                            <input type="text" id="newFileName" placeholder="index.js" class="flex-1 px-3 py-2 bg-gray-700 border border-gray-600 rounded-r-md text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Category</label>
                            <input type="text" id="fileCategoryInput" placeholder="General" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Tags</label>
                            <div class="flex gap-1">
                                <input type="text" id="tagInput" placeholder="Add tags..." class="flex-1 px-3 py-2 bg-gray-700 border border-gray-600 rounded-l-md text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <button onclick="addTag()" class="px-3 py-2 bg-gray-600 hover:bg-gray-500 text-gray-100 rounded-r-md font-medium transition-colors">
                                    Add
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div id="selectedTags" class="flex flex-wrap gap-2"></div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Initial Content (Optional)</label>
                        <div id="initialContentEditor" class="bg-gray-700 rounded-md border border-gray-600 h-48"></div>
                    </div>
                </div>
                
                <div class="flex gap-3 mt-6">
                    <button onclick="createFile()" class="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md font-medium transition-colors">
                        Create File
                    </button>
                    <button onclick="modals.hide('createFile')" class="flex-1 px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-100 rounded-md font-medium transition-colors">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="deleteFileModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-gray-800 rounded-lg shadow-xl w-full max-w-md border border-gray-700">
            <div class="p-6">
                <h2 class="text-xl font-semibold text-gray-100 mb-4">Delete File</h2>
                <p class="text-gray-300 mb-6">
                    Are you sure you want to delete <span id="fileToDeleteName" class="font-semibold text-gray-100"></span>?
                    <br>
                    <span class="text-sm text-gray-400">This action cannot be undone.</span>
                </p>
                
                <div class="flex gap-3">
                    <button onclick="confirmDeleteFile()" class="flex-1 px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-md font-medium transition-colors">
                        Delete
                    </button>
                    <button onclick="modals.hide('deleteFile')" class="flex-1 px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-100 rounded-md font-medium transition-colors">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/php/php.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/yaml/yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/sql/sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/go/go.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/rust/rust.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/ruby/ruby.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldgutter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/brace-fold.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prismjs/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prismjs/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prismjs/1.29.0/components/prism-markup.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prismjs/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prismjs/1.29.0/components/prism-python.min.js"></script>
    
    <script src="https://clockblocked.github.io/gitDev/modules/dependencies.js"></script>
</body>
</html>
