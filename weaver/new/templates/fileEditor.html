<div class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8 py-6 page-transition">
    <div class="flex items-center justify-between mb-4">
        <nav class="flex items-center space-x-1 text-sm">
            <button onclick="router.navigate('/repo/{{repoName}}')" class="text-github-accent-fg hover:underline font-semibold">{{repoName}}</button>
            <span class="text-github-fg-muted">/</span>
            <span class="text-github-fg-default font-semibold">{{fileName}}</span>
        </nav>
        
        <div class="flex items-center space-x-2">
            <button onclick="App.saveFile()" class="inline-flex items-center px-3 py-1.5 bg-github-btn-primary-bg hover:bg-github-btn-primary-hover text-white rounded-md text-sm font-medium transition-colors">
                <i class="fas fa-save mr-2"></i>
                Save
            </button>
            <button onclick="router.navigate('/repo/{{repoName}}/view/{{../currentFile.path}}')" class="inline-flex items-center px-3 py-1.5 border border-github-border-default rounded-md text-sm font-medium text-github-fg-default bg-github-btn-secondary-bg hover:bg-github-btn-secondary-hover transition-colors">
                Cancel
            </button>
        </div>
    </div>
    
    <div class="bg-github-canvas-overlay border border-github-border-default rounded-lg overflow-hidden h-96" id="codeEditorContainer">
        <!-- CodeMirror will be initialized here -->
    </div>
    
    <div class="mt-6 bg-github-canvas-overlay border border-github-border-default rounded-lg p-6">
        <h3 class="text-lg font-semibold text-github-fg-default mb-4">Commit changes</h3>
        <div class="space-y-4">
            <div>
                <input type="text" id="commitTitle" placeholder="Update {{fileName}}" 
                       class="w-full px-3 py-2 bg-github-canvas-inset border border-github-border-default rounded-md text-github-fg-default placeholder-github-fg-muted focus:outline-none focus:ring-2 focus:ring-github-accent-emphasis focus:border-transparent"
                       value="Update {{fileName}}">
            </div>
            <div>
                <textarea id="commitDescription" rows="4" placeholder="Add an optional extended description..." 
                          class="w-full px-3 py-2 bg-github-canvas-inset border border-github-border-default rounded-md text-github-fg-default placeholder-github-fg-muted focus:outline-none focus:ring-2 focus:ring-github-accent-emphasis focus:border-transparent resize-none"></textarea>
            </div>
        </div>
    </div>
</div>
