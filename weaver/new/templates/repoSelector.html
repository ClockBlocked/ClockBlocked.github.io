<div class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8 py-6 page-transition">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold text-github-fg-default">Your Repositories</h2>
        <button onclick="App.showCreateRepoModal()" class="inline-flex items-center px-4 py-2 bg-github-btn-primary-bg hover:bg-github-btn-primary-hover text-white rounded-md text-sm font-medium transition-colors">
            <i class="fas fa-plus mr-2"></i>
            New repository
        </button>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="repoList">
        <div data-bind="repositories" data-template="repoCard"></div>
    </div>
</div>

<template id="repoCard">
    <div class="bg-github-canvas-overlay border border-github-border-default rounded-lg p-4 hover:border-github-accent-fg transition-colors cursor-pointer" 
         onclick="router.navigate('/repo/{{name}}')">
        <div class="flex items-start justify-between">
            <div class="flex-1">
                <h3 class="text-lg font-semibold text-github-accent-fg mb-1">{{name}}</h3>
                <p class="text-sm text-github-fg-muted mb-2">{{description}}</p>
                <div class="flex items-center space-x-4 text-xs text-github-fg-muted">
                    <span>{{formatDate created}}</span>
                    <span class="flex items-center space-x-1">
                        <div class="w-3 h-3 rounded-full bg-github-accent-fg"></div>
                        <span>main</span>
                    </span>
                </div>
            </div>
            <button onclick="event.stopPropagation();App.deleteRepository('{{name}}')" class="text-github-danger-fg hover:text-red-500 p-1">
                <i class="fas fa-trash"></i>
            </button>
        </div>
    </div>
</template>
